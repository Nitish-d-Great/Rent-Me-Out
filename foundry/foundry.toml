[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.23"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
auto_detect_remappings = false
fs_permissions = [
  { access = "read", path = "./fixtures" },
  { access = "read-write", path = "./deployments" },
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@semaphore-protocol/contracts/=node_modules/@semaphore-protocol/contracts/",
  "@zk-kit/lean-imt.sol/=lib/zk-kit-lean-imt/",
  "poseidon-solidity/=node_modules/poseidon-solidity/",
]

[rpc_endpoints]
hedera_testnet = "${HEDERA_RPC_URL}"
